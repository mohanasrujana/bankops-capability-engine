<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>{{ application_name }} — Member Details</title>
  </head>
  <body>
    <table width="760" border="1" cellspacing="0" cellpadding="8">
      <tr>
        <td>
          <h1>{{ application_name }}</h1>
          <p>Member Services Console</p>
        </td>
      </tr>
      <tr>
        <td>
          <h2>Member Details</h2>
          <table border="1" cellspacing="0" cellpadding="6">
            <tr>
              <th scope="row">Member ID</th>
              <td>{{ member.id }}</td>
            </tr>
            <tr>
              <th scope="row">Name</th>
              <td>{{ member.display_name }}</td>
            </tr>
            <tr>
              <th scope="row">Savings Balance</th>
              <td>
                <output aria-label="Savings Balance">{{ formatted_savings_balance }}</output>
              </td>
            </tr>
          </table>
          <p>All displayed records are synthetic demonstration data.</p>
          <p><a href="/">Return to Member Search</a></p>
        </td>
      </tr>
    </table>
  </body>
</html>
